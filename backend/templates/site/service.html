{% load site_extras %}<article class="svc wrap {% if n|divisibleby:2 %}svc-rev{% endif %}" id="service-{{ s.id }}"><div class="f-img reveal-img"><img src="{{ s.image }}" alt="{{ s.title }}" {{ s.image|imgsize }} loading="lazy" decoding="async" data-tilt><span class="num">{{ n|stringformat:"02d" }}</span></div>
<div class="f-text"><span class="eyebrow reveal">{{ s.eyebrow }}</span><h2 class="split">{{ s.title }}</h2><p class="reveal">{% for l in s.description %}{{ l }}{% if not forloop.last %}<br>{% endif %}{% endfor %}</p><div class="reveal btnrow"><a class="btn" href="{{ site.phone_href }}">{{ ui.book }}</a>{% if s.show_details %}<a class="link" href="{{ urls.prices }}">{{ ui.details }}</a>{% endif %}</div></div></article>
