{% load site_extras %}<section class="feature wrap" data-live="{{ live }}" data-fp="{{ fp }}"><div class="f-img reveal-img slider" data-slider aria-roledescription="carousel" role="region" aria-label="{% if lang == 'hu' %}Kezeléseink és klinikánk képekben{% else %}Our treatments and clinic in pictures{% endif %}"><div class="sl-track" aria-live="off"><figure class="sl-slide on" role="group" aria-roledescription="slide" aria-label="1 / 6"><img src="{{ f.image }}" alt="{{ f.title }}" {{ f.image|imgsize }} loading="lazy" decoding="async"></figure>{% for s in slider_slides %}<figure class="sl-slide" role="group" aria-roledescription="slide" aria-label="{{ forloop.counter|add:1 }} / 6" aria-hidden="true"><img src="{{ S }}assets/media/home/slider/{{ s.0 }}.webp" alt="{% if lang == 'hu' %}{{ s.2 }}{% else %}{{ s.1 }}{% endif %}" width="800" height="1000" loading="lazy" decoding="async"></figure>{% endfor %}</div><button type="button" class="sl-arr sl-prev" aria-label="{% if lang == 'hu' %}Előző kép{% else %}Previous image{% endif %}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><button type="button" class="sl-arr sl-next" aria-label="{% if lang == 'hu' %}Következő kép{% else %}Next image{% endif %}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button><div class="sl-dots" role="group" aria-label="{% if lang == 'hu' %}Kép kiválasztása{% else %}Choose image{% endif %}">{% for i in "123456" %}<button type="button" aria-label="{% if lang == 'hu' %}{{ i }}. kép{% else %}Image {{ i }}{% endif %}"{% if forloop.first %} aria-current="true"{% endif %}></button>{% endfor %}</div></div>
<div class="f-text"><span class="eyebrow reveal">{{ f.eyebrow }}</span><h2 class="split">{{ f.title }}</h2>{% for p in f.paragraphs %}<p class="reveal">{{ p|linebreaksbr }}</p>{% endfor %}{% if f.button %}<a class="btn reveal" href="{{ href }}">{{ f.button }}</a>{% endif %}</div></section>
