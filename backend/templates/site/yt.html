<div class="yt {% if v.vertical %}yt-v{% else %}yt-w{% endif %}" data-yt="{{ v.youtube_id }}" data-title="{{ v.title }}"><button type="button" class="yt-btn" aria-label="{{ ui.yt_play }}: {{ v.title }}"><img src="{{ v.poster }}" alt="" width="{{ v.width }}" height="{{ v.height }}" loading="lazy" decoding="async"><strong class="yt-t">{{ v.title }}</strong></button>{% if v.caption %}<small class="yt-c">{{ v.caption }}</small>{% endif %}</div>
